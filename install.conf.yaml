- plugins:
  - dotbot-plugins/git.py
  - dotbot-plugins/apt.py

- shell:
  - [sudo systemctl start dbus, Starting dbus service]
  - [sudo systemctl reset-failed, Resetting failed services]
  - [git submodule update --init --recursive, Installing submodules]

- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.gitconfig: ./config-files/gitconfig
    ~/.zshrc: ./config-files/zshrc
    ~/.zshenv: ./config-files/zshenv
    ~/.vim/vimrc: ./config-files/vim/vimrc
    ~/.vim/colors/PaperColor.vim: ./config-files/vim/colors/PaperColor.vim
    ~/.config/delta: ./config-files/config/delta
    ~/.config/bat/config: ./config-files/config/bat/config
    ~/.config/mise: ./config-files/config/mise
    ~/.config/eza: ./config-files/config/eza
    ~/.config/tmux: ./config-files/config/tmux/
    ~/.config/ruff: ./config-files/config/ruff/
    ~/.config/litecli/config: ./config-files/config/litecli/config
    ~/.config/sqlfluff/setup.cfg: ./config-files/config/sqlfluff/setup.cfg
    ~/.config/.prettierrc.json: ./config-files/config/prettierrc.json
    ~/.config/alacritty: ./config-files/config/alacritty/
    ~/.config/foot: ./config-files/config/foot/
    ~/.local/bin/monitor-brightness: ./config-files/my/scripts/monitor-brightness.sh
    ~/.my: ./config-files/my
    ~/.config/home-manager/flake.nix:
      type: hardlink
      path: ./config-files/config/home-manager/flake.nix
    ~/.config/home-manager/home.nix:
      type: hardlink
      path: ./config-files/config/home-manager/home.nix
    ~/.config/nix/nix.conf:
      type: hardlink
      path: ./config-files/config/nix/nix.conf

- defaults:
    git:
      depth: 1
      create_parents: true

- git:
    ~/.zsh/zsh-autosuggestions: https://github.com/zsh-users/zsh-autosuggestions
    ~/.zsh/zsh-syntax-highlighting: https://github.com/zsh-users/zsh-syntax-highlighting.git
    ~/.zsh/zsh-vi-mode: https://github.com/jeffreytse/zsh-vi-mode.git
    ~/.config/nvim:
      repository: https://github.com/wcs7777/neovimrc.git
      depth:
      branch: work

- defaults:
    apt:
      reinstall: false
      batch_mode: true

- apt:
  - alacritty
  - apt-transport-https
  - autoconf
  - automake
  - build-essential
  - ca-certificates
  - chromium
  - curl
  - file
  - fuse
  - git
  - gnome-tweaks
  - gnupg
  - libffi-dev
  - libicu-dev
  - libncurses-dev
  - libnotify-bin
  - libnspr4
  - libnss3
  - libreadline-dev
  - libssl-dev
  - libxml2-dev
  - libxslt-dev
  - libyaml-dev
  - litecli
  - man-db
  - odbcinst
  - python3-pip
  - python3-venv
  - ssh
  - tmux
  - tree
  - unzip
  - vim-gtk3
  - wget
  - wl-clipboard
  - zip
  - zsh

- shell:
  - mkdir -p ~/Workspace/
  - [./install-scripts/mise.sh, Installing mise]
  - [./install-scripts/docker.sh, Installing docker]
  - [./install-scripts/nvim.sh, Installing nvim]
  - [./install-scripts/ddcutil.sh, Installing ddcutil]
  - [./install-scripts/firefox.sh, Installing firefox]
  - [./install-scripts/cascadia-code.sh, Installing cascadia-code]
  - [./install-scripts/flatpak.sh, Installing flatpak]
  - [./install-scripts/xremap.sh, Installing xremap]
  - [./install-scripts/clicklockd.sh, Installing clicklockd]
  - [~/.local/bin/nvim --headless "+Lazy! install" +qa, Installing Lazy plugins]

- defaults:
    shell:
      stdin: true
      stdout: true
      stderr: true
      quiet: false

- shell:
  - [./install-scripts/smi-display.sh, Installing smi-display]
  - [./install-scripts/nix.sh, Installing nix]
  - [./install-scripts/git-credential-manager.sh, Installing git-credential-manager]
  - [zsh -c "mise install", Installing mise packages]
